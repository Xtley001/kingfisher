version: "3.9"

services:
  # ── Kingfisher Bot ──────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.testnet   # Switch to .env.mainnet for mainnet
    ports:
      - "3001:3001"    # API + WebSocket
    restart: on-failure
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout:  5s
      retries:  3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Dashboard (dev server) ──────────────────────────────────────────────────
  dashboard:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3001"
      VITE_WS_URL:  "ws://localhost:3001/ws"
      VITE_API_KEY: "${API_KEY}"
    depends_on:
      bot:
        condition: service_healthy
